<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Home – Reportes</title>
<style>

:root{
  --bg:#0b0b0b;
  --panel:#111;
  --card:#151515;
  --border:#262626;
  --text:#f5f5f5;
  --muted:#b5b5b5;
  --gold:#d4af37;
  --green:#1dd1a1;
  --red:#e74c3c;
  --blue:#4aa3ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Inter,Arial,sans-serif;
  background:radial-gradient(circle at top,#1a1a1a,#0b0b0b);
  color:var(--text);
}
header{
  padding:28px 16px 22px;
  text-align:center;
  border-bottom:1px solid var(--border);
}
header img{width:120px;margin-bottom:12px}
header h1{margin:0;font-size:28px;letter-spacing:2px;color:var(--gold)}
header .sub{margin-top:6px;font-size:13px;letter-spacing:3px;color:#cfcfcf}
.wrap{max-width:1100px;margin:auto;padding:20px}
label{font-size:12px;color:var(--muted)}
input,select,textarea{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  outline:none;
}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.card{
  background:linear-gradient(180deg,#161616,#101010);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}
.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin:14px 0 22px;
}
button{
  padding:12px 18px;
  border-radius:14px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#1a1a1a,#111);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
button:hover{filter:brightness(1.15)}
button.primary{
  background:linear-gradient(180deg,#1dd1a1,#17b890);
  color:#062a20;
  border:none;
}
button.secondary{border-color:var(--gold);color:var(--gold)}
button.danger{
  background:linear-gradient(180deg,#ff6b6b,#e74c3c);
  border:none;
}
.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:12px;
  color:var(--muted);
}
.badge.ok{color:var(--green);border-color:#1dd1a155}
.badge.warn{color:#ffd166;border-color:#ffd16655}
.money{
  font-size:22px;
  font-weight:900;
  color:var(--green);
}
.muted{font-size:12px;color:var(--muted)}
.hr{border-top:1px solid var(--border);margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}}
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal{width:min(720px,100%);}
.modal h2{margin:0 0 10px;letter-spacing:1px}
.modal .actions{margin:10px 0 0;justify-content:flex-end}
.smallbtn{padding:8px 12px;border-radius:12px;font-weight:800}
.list{display:flex;flex-direction:column;gap:14px}

.controls{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.item-title{font-weight:900}
.totalline{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;margin-top:10px}
@media print{
  button,.controls,input[type="checkbox"],.print-config,.excluded-job,.lang-not-selected{display:none !important;}
  body{background:#fff;color:#000}
  .card{background:#fff;border:1px solid #ccc}
  .muted,.item-title,.money{color:#000 !important}
  .included-job{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Safe Home Logo">
  <h1>SAFE HOME</h1>
  <div class="sub">REPORTES</div>
</header>

<div class="wrap">
  <div class="controls">
    <div>
      <label>Mes</label><br>
      <input type="month" id="monthPick">
    </div>
    <div>
      <label>Villa / Apartamento</label><br>
      <select id="villaPick"></select>
    </div>
    <div style="align-self:end;display:flex;gap:10px;flex-wrap:wrap">
      <button onclick="imprimirFactura()">📄 Imprimir factura</button>
      <button onclick="imprimirReporte()">🖨 Imprimir reporte</button>
      <button onclick="location.href='index.html'">⬅ Volver</button>
    </div>
  </div>

  <div id="result"></div>

  <div class="hr"></div>

  <div class="card">
    <div class="item-title">Totales del reporte</div>
    <div class="totalline">
      <div class="money">RD$ <span id="sumRD">0.00</span></div>
      <div class="money">US$ <span id="sumUSD">0.00</span></div>
    </div>
    <div class="muted">Sin conversión de divisas (se muestran totales separados).</div>
  </div>
</div>

<script>
const JOBS_KEY = "safehome_jobs_base";
const VILLAS_KEY = "safehome_villas";
const $ = id => document.getElementById(id);

let jobs = [];
let villas = [];
const selections = {};

function money(n){
  return Number(n || 0).toLocaleString("es-DO",{minimumFractionDigits:2});
}

function propertyName(v){
  return `${v.owner} – ${v.type || "Villa"} ${v.number}`;
}

function toMinutes(hhmm){
  const [h,m] = String(hhmm || "0:0").split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}

function minutesBetween(a,b){
  const s = toMinutes(a);
  let e = toMinutes(b);
  if(e <= s) e += 24 * 60;
  return e - s;
}

function hoursBetween(a,b){
  return minutesBetween(a,b) / 60;
}

function formatHMFromMinutes(mins){
  const total = Math.max(0, Math.round(Number(mins) || 0));
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}h ${m}m`;
}

function formatDuration(a,b){
  if(!a || !b) return "";
  return formatHMFromMinutes(minutesBetween(a,b));
}

function labor(j){
  if((j.type === "hours" || (j.start && j.end && j.rate)) && j.start && j.end && j.rate){
    return Number((hoursBetween(j.start,j.end) * Number(j.rate)).toFixed(2));
  }
  return Number(j.labor || 0);
}

function langFields(j){
  return {
    subjectEs: j.subjectEs !== undefined ? (j.subjectEs || "") : (j.subject || j.desc || ""),
    detailsEs: j.detailsEs !== undefined ? (j.detailsEs || "") : (j.details || ""),
    subjectEn: j.subjectEn || "",
    detailsEn: j.detailsEn || ""
  };
}

function esc(v){
  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function load(){
  jobs = JSON.parse(localStorage.getItem(JOBS_KEY) || "[]");
  villas = JSON.parse(localStorage.getItem(VILLAS_KEY) || "[]");
}

function getSelection(index, job){
  if(!selections[index]){
    const lf = langFields(job);
    const hasEs = !!(lf.subjectEs || lf.detailsEs);
    const hasEn = !!(lf.subjectEn || lf.detailsEn);
    selections[index] = {
      include: true,
      es: hasEs,
      en: hasEn,
      expenses: false
    };
  }
  return selections[index];
}

function setInclude(index, checked){
  const j = jobs[index];
  if(!j) return;
  getSelection(index,j).include = checked;
  render();
}

function setLanguage(index, lang, checked){
  const j = jobs[index];
  if(!j) return;
  const s = getSelection(index,j);
  if(lang === "es") s.es = checked;
  if(lang === "en") s.en = checked;
  render();
}

function setExpenses(index, checked){
  const j = jobs[index];
  if(!j) return;
  getSelection(index,j).expenses = checked;
  render();
}

function filteredJobs(){
  const m = $("monthPick").value;
  const v = $("villaPick").value;
  return jobs
    .map((j,index)=>({job:j,index}))
    .filter(x => (x.job.date || "").startsWith(m))
    .filter(x => v === "ALL" || x.job.villa === v);
}

function computeTotals(items){
  let rd = 0;
  let usd = 0;

  items.forEach(({job,index})=>{
    const s = getSelection(index,job);
    if(!s.include) return;

    const lab = labor(job);
    const exps = s.expenses ? (job.expenses || []) : [];
    const total = lab + exps.reduce((sum,e)=>sum + Number(e.amount || 0),0);
    const cur = job.currency || "RD$";

    if(cur === "US$") usd += total;
    else rd += total;
  });

  $("sumRD").textContent = money(rd);
  $("sumUSD").textContent = money(usd);
}

function render(){
  const box = $("result");
  const items = filteredJobs();
  box.innerHTML = "";

  if(!items.length){
    box.innerHTML = "<div class='muted'>No hay trabajos para esta selección.</div>";
    $("sumRD").textContent = money(0);
    $("sumUSD").textContent = money(0);
    return;
  }

  items.forEach(({job,index})=>{
    const s = getSelection(index,job);
    const lf = langFields(job);
    const hasEs = !!(lf.subjectEs || lf.detailsEs);
    const hasEn = !!(lf.subjectEn || lf.detailsEn);
    const cur = job.currency || "RD$";
    const lab = labor(job);
    const exps = s.expenses ? (job.expenses || []) : [];
    const total = lab + exps.reduce((sum,e)=>sum + Number(e.amount || 0),0);

    const card = document.createElement("div");
    card.className = `card report-job ${s.include ? "included-job" : "excluded-job"}`;
    card.style.marginBottom = "14px";

    card.innerHTML = `
      <div class="lang-es ${s.es && hasEs ? "" : "lang-not-selected"}">
        ${lf.subjectEs ? `<div class="item-title">🇩🇴 ${esc(lf.subjectEs)}</div>` : ""}
        ${lf.detailsEs ? `<div class="muted" style="margin-top:4px">${esc(lf.detailsEs)}</div>` : ""}
      </div>

      <div class="lang-en ${s.en && hasEn ? "" : "lang-not-selected"}">
        ${lf.subjectEn ? `<div class="item-title" style="margin-top:8px">🇺🇸 ${esc(lf.subjectEn)}</div>` : ""}
        ${lf.detailsEn ? `<div class="muted" style="margin-top:4px">${esc(lf.detailsEn)}</div>` : ""}
      </div>

      <div class="muted">${job.date || ""} · ${esc(job.villa || "")} · ${cur}</div>

      <div class="print-config" style="margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:14px;background:#111">
        <label>
          <input type="checkbox" ${s.include ? "checked" : ""}
            onchange="setInclude(${index}, this.checked)">
          Incluir este trabajo en la factura
        </label>
        <div class="muted" style="margin-top:6px">
          Estado: ${s.include ? "Incluido para cobrar" : "No incluido para cobrar"}
        </div>
      </div>

      <div class="print-config" style="margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:14px">
        <strong>Idioma que aparecerá en la factura:</strong>
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px">
          <label style="opacity:${hasEs ? 1 : .45}">
            <input type="checkbox" ${s.es && hasEs ? "checked" : ""} ${hasEs ? "" : "disabled"}
              onchange="setLanguage(${index}, 'es', this.checked)">
            Español
          </label>
          <label style="opacity:${hasEn ? 1 : .45}">
            <input type="checkbox" ${s.en && hasEn ? "checked" : ""} ${hasEn ? "" : "disabled"}
              onchange="setLanguage(${index}, 'en', this.checked)">
            Inglés
          </label>
        </div>
        <div class="muted" style="margin-top:6px">Puedes seleccionar uno o los dos idiomas.</div>
      </div>

      ${job.start ? `<div style="margin-top:10px">⏰ ${job.start} → ${job.end}</div>` : ""}
      ${job.rate ? `<div class="muted">⏱️ ${formatDuration(job.start,job.end)} · 💲 ${cur} ${money(job.rate)} / hora</div>` : ""}
      <div>Mano de obra: <strong>${cur} ${money(lab)}</strong></div>

      <div class="print-config" style="margin-top:10px;padding:10px 12px;border:1px dashed var(--border);border-radius:14px">
        <label>
          <input type="checkbox" ${s.expenses ? "checked" : ""}
            onchange="setExpenses(${index}, this.checked)">
          Incluir gastos en este trabajo
        </label>
        <div class="muted" style="margin-top:6px">
          ${(job.expenses || []).length
            ? `Estado de gastos: ${s.expenses ? "Incluidos" : "No incluidos"}`
            : "Sin gastos"}
        </div>
      </div>

      ${s.expenses && (job.expenses || []).length ? `
        <div class="expense-summary" style="margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px">
          <div style="font-weight:900;margin-bottom:6px">GASTOS / EXPENSES</div>
          ${(job.expenses || []).map(e=>`
            <div style="margin-top:4px">
              ${esc(e.desc || "Gasto")}: <strong>${cur} ${money(e.amount)}</strong>
            </div>
          `).join("")}
        </div>
      ` : ""}

      <div style="text-align:right;font-weight:900;color:var(--green);margin-top:10px">
        ${s.include ? `TOTAL A COBRAR: ${cur} ${money(total)}` : `NO INCLUIDO: ${cur} ${money(total)}`}
      </div>
    `;

    box.appendChild(card);
  });

  computeTotals(items);
}

function buildInvoiceData(){
  const v = $("villaPick").value;
  const m = $("monthPick").value;

  if(v === "ALL"){
    return {error:"Selecciona una villa o apartamento para generar la factura"};
  }

  const invoiceItems = [];

  for(const {job,index} of filteredJobs()){
    const s = getSelection(index,job);
    if(!s.include) continue;

    const lf = langFields(job);
    const selectedTexts = [];

    if(s.es && (lf.subjectEs || lf.detailsEs)){
      selectedTexts.push({
        lang:"es",
        subject:lf.subjectEs || "",
        details:lf.detailsEs || ""
      });
    }

    if(s.en && (lf.subjectEn || lf.detailsEn)){
      selectedTexts.push({
        lang:"en",
        subject:lf.subjectEn || "",
        details:lf.detailsEn || ""
      });
    }

    if(selectedTexts.length === 0){
      return {error:"Hay un trabajo incluido sin idioma seleccionado. Marca Español, Inglés o ambos."};
    }

    const lab = labor(job);
    const cur = job.currency || "RD$";
    const exps = s.expenses
      ? (job.expenses || []).map(e=>({
          desc: e.desc || "Gasto",
          amount: Number(e.amount || 0)
        }))
      : [];

    const total = lab + exps.reduce((sum,e)=>sum + Number(e.amount || 0),0);

    invoiceItems.push({
      selectedTexts,
      date: job.date || "",
      currency: cur,
      start: job.start || "",
      end: job.end || "",
      hours_decimal: job.start && job.end ? Number(hoursBetween(job.start,job.end).toFixed(2)) : null,
      hours_fmt: job.start && job.end ? formatDuration(job.start,job.end) : null,
      rate: Number(job.rate || 0),
      labor: lab,
      expenses: exps,
      total
    });
  }

  if(!invoiceItems.length){
    return {error:"No hay trabajos seleccionados para la factura"};
  }

  return {
    data:{
      villa:v,
      mes:m,
      items:invoiceItems
    }
  };
}

function imprimirFactura(){
  const result = buildInvoiceData();
  if(result.error){
    alert(result.error);
    return;
  }

  const payload = encodeURIComponent(JSON.stringify(result.data));
  window.open(`factura.html#data=${payload}`,"_blank");
}

function imprimirReporte(){
  const items = filteredJobs().filter(({job,index})=>getSelection(index,job).include);

  if(!items.length){
    alert("No hay trabajos seleccionados para imprimir.");
    return;
  }

  for(const {job,index} of items){
    const s = getSelection(index,job);
    const lf = langFields(job);
    const hasSelectedLanguage =
      (s.es && (lf.subjectEs || lf.detailsEs)) ||
      (s.en && (lf.subjectEn || lf.detailsEn));

    if(!hasSelectedLanguage){
      alert("Hay un trabajo seleccionado sin idioma. Marca Español, Inglés o ambos.");
      return;
    }
  }

  window.print();
}

document.addEventListener("DOMContentLoaded",()=>{
  load();

  $("monthPick").value = new Date().toISOString().slice(0,7);
  $("villaPick").innerHTML = `<option value="ALL">Seleccionar villa / apartamento</option>`;

  villas.forEach(v=>{
    const n = propertyName(v);
    const option = document.createElement("option");
    option.value = n;
    option.textContent = n;
    $("villaPick").appendChild(option);
  });

  $("monthPick").addEventListener("change",render);
  $("villaPick").addEventListener("change",render);

  render();
});

window.setInclude = setInclude;
window.setLanguage = setLanguage;
window.setExpenses = setExpenses;
window.imprimirFactura = imprimirFactura;
window.imprimirReporte = imprimirReporte;
</script>
</body>
</html>
